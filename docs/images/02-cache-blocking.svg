<text x="480" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">row of tiles: k = 0, 1, 2, 3</text>
<text x="790" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">column of tiles: k = 0, 1, 2, 3</text>
<text x="490" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#24292f" text-anchor="middle" xml:space="preserve">Working set per step = 3 tiles of B × B doubles = 3 · B² · 8 bytes</text>
<text x="490" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">Choose B so it fits in cache:  B ≤ √(cache size / 24).  For a 32 KB L1 cache, B ≤ 36, so start with 32 and tune.</text>
<text x="490" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">Each tile is reused B times before it leaves the cache, which cuts memory traffic by roughly a factor of B.</text>
</svg>
