<line x1="212" y1="119" x2="398" y2="119" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-blue)"/>
<line x1="212" y1="137" x2="398" y2="137" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-orange)"/>
<line x1="602" y1="128" x2="788" y2="128" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a-green)"/>
