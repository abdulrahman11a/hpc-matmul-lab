<rect x="45" y="164.5" width="140" height="32.5" rx="0" fill="#aceebb" stroke="#1a7f37" stroke-width="1.5"/>
<text x="115" y="185.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle" xml:space="preserve">A1</text>
<rect x="45" y="197" width="140" height="32.5" rx="0" fill="#ffd8b5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="115" y="218.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#bc4c00" text-anchor="middle" xml:space="preserve">A2</text>
<rect x="45" y="229.5" width="140" height="32.5" rx="0" fill="#e8c8ff" stroke="#8250df" stroke-width="1.5"/>
