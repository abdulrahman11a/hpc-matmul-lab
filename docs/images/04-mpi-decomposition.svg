<text x="115" y="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">A split into 4 row blocks</text>
<rect x="65" y="300" width="100" height="70" rx="0" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/>
<text x="115" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#57606a" text-anchor="middle" xml:space="preserve">B (full matrix)</text>
