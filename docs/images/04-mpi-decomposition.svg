<text x="412" y="210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">A1: N/p rows of A</text>
<text x="412" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">B: full copy</text>
<text x="412" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">C1 = A1 × B</text>
<line x1="212" y1="203" x2="398" y2="203" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-blue)"/>
<line x1="212" y1="221" x2="398" y2="221" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-orange)"/>
<line x1="602" y1="212" x2="788" y2="212" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="400" y="258" width="200" height="76" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="412" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#bc4c00" text-anchor="start" xml:space="preserve">Rank 2</text>
<text x="412" y="294" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">A2: N/p rows of A</text>
<text x="412" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">B: full copy</text>
<text x="412" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">C2 = A2 × B</text>
<line x1="212" y1="287" x2="398" y2="287" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-blue)"/>
<line x1="212" y1="305" x2="398" y2="305" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-orange)"/>
<line x1="602" y1="296" x2="788" y2="296" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="400" y="342" width="200" height="76" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="412" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#8250df" text-anchor="start" xml:space="preserve">Rank 3</text>
<text x="412" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">A3: N/p rows of A</text>
<text x="412" y="394" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">B: full copy</text>
<text x="412" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">C3 = A3 × B</text>
<line x1="212" y1="371" x2="398" y2="371" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-blue)"/>
<line x1="212" y1="389" x2="398" y2="389" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-orange)"/>
<line x1="602" y1="380" x2="788" y2="380" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a-green)"/>
<line x1="40" y1="450" x2="68" y2="450" stroke="#0969da" stroke-width="2"/>
<text x="76" y="454" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">MPI_Scatter(A): row block i → rank i</text>
<line x1="360" y1="450" x2="388" y2="450" stroke="#bc4c00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="396" y="454" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">MPI_Bcast(B): full B → every rank</text>
<line x1="680" y1="450" x2="708" y2="450" stroke="#1a7f37" stroke-width="2"/>
<text x="716" y="454" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">MPI_Gather(C): block C_i → rank 0</text>
<text x="490" y="486" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">Memory per rank ≈ N²/p + N² + N²/p doubles: B is replicated, so memory does not shrink as p grows (Cannon / SUMMA are future work).</text>
<text x="490" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">Report compute-only time and compute + communication time separately.</text>
</svg>
