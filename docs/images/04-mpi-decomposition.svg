<rect x="805" y="164.5" width="140" height="32.5" rx="0" fill="#aceebb" stroke="#1a7f37" stroke-width="1.5"/>
<text x="875" y="185.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="middle" xml:space="preserve">C1</text>
<rect x="805" y="197" width="140" height="32.5" rx="0" fill="#ffd8b5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="875" y="218.25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#bc4c00" text-anchor="middle" xml:space="preserve">C2</text>
<rect x="805" y="229.5" width="140" height="32.5" rx="0" fill="#e8c8ff" stroke="#8250df" stroke-width="1.5"/>
<text x="875" y="250.75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#8250df" text-anchor="middle" xml:space="preserve">C3</text>
<text x="875" y="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve">C assembled from 4 blocks</text>
<rect x="400" y="90" width="200" height="76" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="412" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0969da" text-anchor="start" xml:space="preserve">Rank 0</text>
<text x="412" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">A0: N/p rows of A</text>
<text x="412" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#24292f" text-anchor="start" xml:space="preserve">B: full copy</text>
